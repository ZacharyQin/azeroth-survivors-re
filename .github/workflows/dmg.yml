# Player build of the native launcher, packed as an arm64 DMG.
# Game data is not downloaded and is not in the image. The app looks for a
# 1.12.1 Data folder at runtime (see the README written into the image).
name: dmg

on:
  workflow_dispatch:
  push:
    branches: [ci/macos-dmg]

permissions:
  contents: read
  actions: write

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          set -euxo pipefail
          df -h /
          AVAIL_KB="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=$AVAIL_KB"
          if [ "$AVAIL_KB" -lt 20000000 ]; then
            echo "need at least 20 GiB free"
            exit 1
          fi

      - name: Toolchain
        run: rustup show && rustc -V

      - name: Build player binary
        run: cargo build --release -p warcraft-survivors --no-default-features

      - name: Pack DMG
        run: |
          set -euxo pipefail
          BIN="target/release/warcraft-survivors"
          file "$BIN"
          file "$BIN" | grep -q "arm64"
          strip -x "$BIN" || true

          STAGE="${RUNNER_TEMP}/dmg-src"
          APP="$STAGE/Azeroth Survivors.app"
          MACOS="$APP/Contents/MacOS"
          rm -rf "$STAGE"
          mkdir -p "$MACOS" "$APP/Contents/Resources"
          cp "$BIN" "$MACOS/warcraft-survivors"
          cp LICENSE-MIT LICENSE-APACHE "$APP/Contents/Resources/"

          cp packaging/macos/launch "$MACOS/launch"
          chmod 755 "$MACOS/launch" "$MACOS/warcraft-survivors"

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Azeroth Survivors</string>
            <key>CFBundleDisplayName</key><string>Azeroth Survivors</string>
            <key>CFBundleIdentifier</key><string>dev.azeroth-survivors.player</string>
            <key>CFBundleVersion</key><string>${GITHUB_SHA}</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>launch</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"

          cat > "$STAGE/README.txt" << 'EOF'
          Azeroth Survivors (macOS arm64)

          This image is the engine only. On first launch, if no local Data folder is
          found, the app downloads the 1.12.1 client archive (about 5.5 GB) into:

            ~/Library/Application Support/Azeroth Survivors/Data

          An existing Data folder is used instead, in this order: that path, then
          <same folder as the app>/Data, then <same folder as the app>/WoW/Data.
          Set WOW_DATA to skip the search and the download.

          Downloads of this disk image are quarantined. If the app is killed on open:

            xattr -dr com.apple.quarantine "/path/to/Azeroth Survivors.app"

          The signature is ad-hoc, not an Apple Developer ID.
          EOF

          codesign --force --sign - --timestamp=none "$MACOS/warcraft-survivors"
          if codesign --force --sign - --timestamp=none "$APP"; then
            codesign -dv --verbose=2 "$APP"
          else
            echo "bundle ad-hoc sign failed; the arm64 binary is signed"
            codesign -dv "$MACOS/warcraft-survivors"
          fi

          du -sh "$MACOS/warcraft-survivors" "$STAGE"
          rm -rf target "${HOME}/.cargo/registry" "${HOME}/.cargo/git"
          df -h /
          KB="$(du -sk "$STAGE" | awk '{print $1}')"
          SIZE_MB="$(( KB / 1024 * 2 + 512 ))"
          echo "stage_kb=$KB image_mb=$SIZE_MB"
          RAW="${RUNNER_TEMP}/raw.dmg"
          MNT="${RUNNER_TEMP}/dmg-mnt"
          mkdir -p "$MNT"
          hdiutil create -size "${SIZE_MB}m" -fs APFS -volname "Azeroth Survivors" -ov "$RAW"
          hdiutil attach "$RAW" -mountpoint "$MNT" -nobrowse -noverify
          ditto "$STAGE" "$MNT"
          hdiutil detach "$MNT"
          rm -f AzerothSurvivors-macos-arm64.dmg
          hdiutil convert "$RAW" -format UDZO -o AzerothSurvivors-macos-arm64.dmg
          rm -f "$RAW"
          ls -lh AzerothSurvivors-macos-arm64.dmg
          hdiutil verify AzerothSurvivors-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AzerothSurvivors-macos-arm64
          path: AzerothSurvivors-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0
